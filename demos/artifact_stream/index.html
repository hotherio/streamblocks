<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Streaming artifacts</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1c1b19; --muted: #6b6861; --line: #dedbd3;
    --accent: #1f6f5c; --accent-soft: #e2f0ec; --warn: #a23b2a; --warn-soft: #f7e4e0; --code: #f1efe9;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151614; --panel: #1e201d; --ink: #ecebe6; --muted: #9a978f; --line: #33352f;
      --accent: #6cc7ae; --accent-soft: #1d332d; --warn: #f08a76; --warn-soft: #3a211d; --code: #181a17;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
  header { padding: 20px 24px 12px; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
  .badge { font: 12px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
  .controls { padding: 0 24px 16px; display: grid; gap: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  textarea { width: 100%; min-height: 62px; resize: vertical; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--panel); color: var(--ink); font: 14px/1.45 var(--sans); }
  button { font: 14px var(--sans); border-radius: 8px; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); padding: 7px 14px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
  button:disabled { opacity: 0.5; cursor: default; }
  label.switch { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--panel); cursor: pointer; user-select: none; }
  label.switch small { color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(240px, 1fr) minmax(320px, 2fr) minmax(240px, 1fr); gap: 14px;
    padding: 0 24px 24px; align-items: start; }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-height: 320px; }
  section > h2 { margin: 0; padding: 10px 14px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }
  #answer { padding: 12px 14px; white-space: pre-wrap; }
  #answer p { margin: 0 0 8px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line); min-height: 46px; }
  .tab { font: 12px var(--mono); padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); cursor: pointer;
    background: transparent; color: var(--ink); }
  .tab.active { background: var(--accent-soft); border-color: var(--accent); }
  .tab.writing::after { content: " ●"; color: var(--accent); }
  .tab.rejected { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); text-decoration: line-through; }
  pre { margin: 0; padding: 14px; font: 13px/1.5 var(--mono); background: var(--code); min-height: 260px; overflow: auto;
    white-space: pre; tab-size: 4; }
  #events { list-style: none; margin: 0; padding: 8px 0; font: 12.5px/1.45 var(--mono); max-height: 420px; overflow: auto; }
  #events li { padding: 3px 14px; }
  #events li.bad { color: var(--warn); background: var(--warn-soft); }
  #events li.good { color: var(--accent); }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--line); border-top: 1px solid var(--line); }
  .stat { background: var(--panel); padding: 10px 14px; }
  .stat b { display: block; font: 600 20px var(--mono); }
  .stat span { color: var(--muted); font-size: 12px; }
  .stat.bad b { color: var(--warn); }
</style>
</head>
<body>
<header>
  <h1>Streaming artifacts</h1>
  <span class="badge" id="backend">connecting…</span>
</header>

<div class="controls">
  <div class="row" id="presets"></div>
  <textarea id="prompt" aria-label="Request"></textarea>
  <div class="row">
    <label class="switch"><input type="checkbox" id="grammar"> Grammar <small>well-formed blocks only</small></label>
    <label class="switch"><input type="checkbox" id="guard" checked> Guard <small>files must stay in src/, tests/, docs/</small></label>
    <button class="primary" id="run">Generate</button>
  </div>
</div>

<main>
  <section><h2>Answer</h2><div id="answer"></div></section>
  <section>
    <h2>Files</h2>
    <div class="tabs" id="tabs"></div>
    <pre id="code"></pre>
  </section>
  <section>
    <h2>Events</h2>
    <ul id="events"></ul>
    <div class="stats">
      <div class="stat"><b id="s-pieces">0</b><span>pieces generated</span></div>
      <div class="stat"><b id="s-artifacts">0</b><span>artifacts applied</span></div>
      <div class="stat" id="s-malformed-box"><b id="s-malformed">0</b><span>rejected or malformed</span></div>
      <div class="stat"><b id="s-seconds">–</b><span>seconds</span></div>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const blocks = new Map();   // block id -> {path, lines, state}
const files = new Map();    // path -> final content
let active = null, source = null;

function log(text, cls) {
  const li = document.createElement("li");
  li.textContent = text;
  if (cls) li.className = cls;
  $("events").append(li);
  li.scrollIntoView({ block: "nearest" });
}

function render() {
  const tabs = $("tabs");
  tabs.replaceChildren();
  const shown = new Map();
  for (const [id, block] of blocks) shown.set(block.state === "done" ? block.path : id, { id, ...block });
  for (const [key, block] of shown) {
    const tab = document.createElement("button");
    tab.className = "tab" + (key === active ? " active" : "") + (block.state === "writing" ? " writing" : "")
      + (block.state === "rejected" ? " rejected" : "");
    tab.textContent = block.path;
    tab.onclick = () => { active = key; render(); };
    tabs.append(tab);
  }
  const current = shown.get(active);
  $("code").textContent = !current ? "" : current.state === "done" ? files.get(current.path) : current.lines.join("\n");
}

function handle(message) {
  if (message.type === "text") {
    if (message.text.trim()) { const p = document.createElement("p"); p.textContent = message.text; $("answer").append(p); }
  } else if (message.type === "start") {
    blocks.set(message.id, { path: message.path, lines: [], state: "writing" });
    active = message.id;
    log(`start   ${message.kind || "block"}  ${message.path}`);
  } else if (message.type === "delta") {
    blocks.get(message.id)?.lines.push(message.line);
  } else if (message.type === "end") {
    const block = blocks.get(message.id);
    block.state = "done"; block.path = message.path;
    files.set(message.path, message.content);
    active = message.path;
    log(`${message.applied.padEnd(7)} ${message.path}`, "good");
  } else if (message.type === "error") {
    const block = blocks.get(message.id);
    if (block) block.state = "rejected";
    log(`${message.code}  ${message.reason}`, "bad");
  } else if (message.type === "done") {
    $("s-pieces").textContent = message.pieces;
    $("s-artifacts").textContent = message.artifacts;
    $("s-malformed").textContent = message.malformed;
    $("s-malformed-box").classList.toggle("bad", message.malformed > 0);
    $("s-seconds").textContent = message.seconds;
    log(message.aborted ? "generation stopped by the guard" : "generation finished", message.aborted ? "bad" : "good");
    stop();
  }
  render();
}

function stop() {
  if (source) source.close();
  source = null;
  $("run").disabled = false;
}

function start() {
  blocks.clear(); files.clear(); active = null;
  $("answer").replaceChildren(); $("events").replaceChildren();
  for (const id of ["s-pieces", "s-artifacts", "s-malformed"]) $(id).textContent = "0";
  $("s-seconds").textContent = "–";
  $("s-malformed-box").classList.remove("bad");
  render();
  $("run").disabled = true;
  const query = new URLSearchParams({
    prompt: $("prompt").value, grammar: $("grammar").checked ? "1" : "0", guard: $("guard").checked ? "1" : "0",
  });
  source = new EventSource(`/stream?${query}`);
  source.onmessage = (event) => handle(JSON.parse(event.data));
  source.onerror = () => { if (source) { log("connection closed", "bad"); stop(); } };
}

fetch("/presets").then((response) => response.json()).then((data) => {
  $("backend").textContent = data.backend === "replay" ? "replay (no model)" : `${data.backend} · ${data.model}`;
  for (const [name, text] of Object.entries(data.presets)) {
    const button = document.createElement("button");
    button.textContent = name === "package" ? "Example: small package" : "Example: tries to write ../.env";
    button.onclick = () => { $("prompt").value = text; };
    $("presets").append(button);
  }
  $("prompt").value = data.presets.package;
});
$("run").onclick = start;
</script>
</body>
</html>
